name: pre-commit

on:
  push:
  pull_request:

jobs:
  pre-commit:

    runs-on: ubuntu-latest

    # No secrets needed - using sensible defaults from config.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        working-directory: ./backend
        run: uv sync --all-extras --dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches frontend/.nvmrc and ci.yml.
          node-version: "22"

      - name: Install Node dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # These hooks assume a local zsh + nvm + pnpm login shell (or a running
          # backend, for the codegen hooks) and cannot run on the CI runner —
          # a `zsh -lc` login shell there loses pnpm from PATH. The equivalent
          # gates run robustly in ci.yml (typecheck / lint / i18n / build), so
          # skip the environment-dependent hooks here and let pre-commit CI
          # enforce the portable ones (ruff, file hygiene). Local `pre-commit`
          # behaviour is unchanged (nothing is skipped locally).
          SKIP: frontend-lint,frontend-prettier,frontend-tsc,generate-openapi-schema,generate-frontend-client,i18n-parity