name: Bug Report
description: Report a reproducible bug in cr-starter
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as possible so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Clone the repo
        2. Run `make start-next-only`
        3. Navigate to /dashboard
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Setup path
      description: Which setup path are you using?
      options:
        - "Path A: Next only (no local backend)"
        - "Path B: Full stack (with backend)"
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node version
      placeholder: "22.x"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that might help.
