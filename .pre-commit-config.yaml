fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: run frontend lint
        # zsh -l loads ~/.zshrc (nvm); `nvm use --silent || true` is safe when
        # pre-commit's env already has the right node on PATH.
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && pnpm run lint'
        language: system
        types: [ file ]
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: Run Prettier on frontend files
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && pnpm run prettier'
        language: system
        types: [ file ]
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: frontend-tsc
        name: run frontend tsc
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && pnpm run tsc'
        language: system
        types: [ file ]
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: generate-openapi-schema
        name: generate OpenAPI schema
        entry: bash -c 'cd backend && uv run python -m commands.generate_openapi_schema'
        language: system
        # Only run OpenAPI schema generation if schemas.py, main.py or package version have changed:
        files: (main\.py$|schemas\.py$|pyproject\.toml)
        pass_filenames: false
      - id: generate-frontend-client
        name: generate frontend client
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && OPENAPI_OUTPUT_FILE=../local-shared-data/openapi.json pnpm run generate-client'
        language: system
        # Only run frontend client generation if the OpenAPI schema has changed:
        files: openapi\.json$
        pass_filenames: false
      - id: i18n-parity
        name: check i18n parity (en/es/de)
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && node scripts/check-i18n-parity.js'
        language: system
        # Always run so parity is checked even when unrelated files change
        # (a locale file edited in a parallel branch could drift silently otherwise).
        always_run: true
        pass_filenames: false
