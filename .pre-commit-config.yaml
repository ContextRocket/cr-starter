fail_fast: true
# Verification tiers (cr-sdag): the fast COMMIT tier runs lint-staged + hygiene
# only; the thorough checks (whole-project tsc, i18n parity) run on PRE-PUSH.
# `default_install_hook_types` makes `pre-commit install` wire up both stages.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      # (commit, fast) lint-staged: eslint --fix + prettier --write on STAGED
      # files only — no whole-project lint/prettier on commit. Keeps commits
      # fast; the thorough checks run on pre-push (below) and in CI.
      - id: frontend-lint-staged
        name: lint-staged (eslint + prettier on staged frontend files)
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && pnpm exec lint-staged'
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css)$
        pass_filenames: false
      # (pre-push, thorough) whole-project typecheck — off the commit path.
      - id: frontend-tsc
        name: run frontend tsc (pre-push)
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && pnpm run tsc'
        language: system
        stages: [pre-push]
        types: [ file ]
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: generate-openapi-schema
        name: generate OpenAPI schema
        entry: bash -c 'cd backend && uv run python -m commands.generate_openapi_schema'
        language: system
        # Only run OpenAPI schema generation if schemas.py, main.py or package version have changed:
        files: (main\.py$|schemas\.py$|pyproject\.toml)
        pass_filenames: false
      - id: generate-frontend-client
        name: generate frontend client
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && OPENAPI_OUTPUT_FILE=../local-shared-data/openapi.json pnpm run generate-client'
        language: system
        # Only run frontend client generation if the OpenAPI schema has changed:
        files: openapi\.json$
        pass_filenames: false
      # (pre-push, thorough) parity across en/es/de — off the commit path.
      - id: i18n-parity
        name: check i18n parity (en/es/de) (pre-push)
        entry: zsh -lc 'cd frontend && nvm use --silent 2>/dev/null || true && node scripts/check-i18n-parity.js'
        language: system
        stages: [pre-push]
        # Always run so parity is checked even when unrelated files change
        # (a locale file edited in a parallel branch could drift silently otherwise).
        always_run: true
        pass_filenames: false
