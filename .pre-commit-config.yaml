fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key

  - repo: local
    hooks:
      - id: i18n-parity
        name: check i18n parity (pre-push)
        entry: zsh -lc 'nvm use --silent 2>/dev/null || true && node scripts/check-i18n-parity.cjs'
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: theme-check
        name: validate theme tokens (pre-push)
        entry: zsh -lc 'nvm use --silent 2>/dev/null || true && node scripts/validate-theme.mjs'
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
